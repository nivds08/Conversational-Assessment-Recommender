<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHL Assessment Recommender</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f5f6f8; color: #1f2937; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,.06); }
  header { padding: 14px 18px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  header button { border: 1px solid #d1d5db; background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  #chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .bot { align-self: flex-start; background: #f1f3f5; }
  .cards { align-self: flex-start; display: flex; flex-direction: column; gap: 8px; width: 85%; }
  .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; text-decoration: none; color: inherit; display: block; }
  .card:hover { border-color: #2563eb; }
  .card b { display: block; }
  .tag { font-size: 12px; color: #6b7280; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e7eb; }
  input { flex: 1; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 999px; font-size: 15px; }
  form button { border: 0; background: #2563eb; color: #fff; border-radius: 999px; padding: 0 20px; font-size: 15px; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>SHL Assessment Recommender</h1>
    <button id="reset" type="button">New chat</button>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="e.g. mid-level Java developer, under 30 minutes" autocomplete="off" required>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
let messages = [];

function addMsg(text, role) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function addCards(recs) {
  if (!recs.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'cards';
  recs.forEach(r => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = r.url;
    a.target = '_blank';
    a.rel = 'noopener';
    const name = document.createElement('b');
    name.textContent = r.name;
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = r.test_type;
    a.append(name, tag);
    wrap.appendChild(a);
  });
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function greet() {
  messages = [];
  chat.innerHTML = '';
  addMsg("Hi! Tell me about the role you're hiring for and I'll suggest SHL assessments.", 'bot');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  messages.push({ role: 'user', content: text });
  addMsg(text, 'user');
  const pending = addMsg('Thinking… (first reply can take ~30–50s if the server was asleep)', 'bot');
  send.disabled = true;
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    pending.textContent = data.reply;
    messages.push({ role: 'assistant', content: data.reply });
    addCards(data.recommendations || []);
  } catch (err) {
    console.error(err);
    pending.textContent = 'Something went wrong (' + err.message + '). Please try again.';
    messages.pop();
  } finally {
    send.disabled = false;
    input.focus();
  }
});

document.getElementById('reset').addEventListener('click', greet);
greet();
</script>
</body>
</html>
